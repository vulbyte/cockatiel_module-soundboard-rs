[package]
name = "cockatiel_soundboard"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — viewers spend points to play whitelisted sound effects on the streamer's machine"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "24464af1b6664c88bde4b22ad6326dd40223c40c" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
rodio = "0.19"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg"] }
broadcast-loudness = "0.3"